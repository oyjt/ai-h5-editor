name: Build & Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /ai-h5-editor/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify bundled example assets
        shell: bash
        run: |
          set -euo pipefail

          echo "Bundled example images:"
          find dist/assets -maxdepth 1 -type f \
            \( -name 'summer-hero-*.jpg' -o -name 'product-sunscreen-*.jpg' -o -name 'product-headphones-*.jpg' \) \
            -printf '%f %s bytes\n' | sort

          for name in summer-hero product-sunscreen product-headphones; do
            asset="$(find dist/assets -maxdepth 1 -type f -name "${name}-*.jpg" -print -quit)"
            if [[ -z "$asset" ]]; then
              echo "::error::Bundled asset '${name}' was not emitted into dist/assets"
              exit 1
            fi

            mime="$(file --brief --mime-type "$asset")"
            echo "$asset -> $mime"
            if [[ "$mime" != "image/jpeg" ]]; then
              echo "::error file=$asset::Expected image/jpeg, got $mime"
              exit 1
            fi
          done

          if grep -R -n '/marketing/\(summer-hero\|product-sunscreen\|product-headphones\)\.jpg' dist; then
            echo "::error::Legacy /marketing JPG URLs are still present in the build output"
            exit 1
          fi

      # GitHub Pages 对 history 路由的直接访问会回退到 404.html。
      # 复制 SPA 入口后，Vue Router 可继续根据当前 URL 完成客户端路由匹配。
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-editor-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
