name: Build & Preview

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /ai-h5-editor/

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Verify marketing assets
        shell: bash
        run: |
          set -euo pipefail

          assets=(
            "dist/marketing/summer-hero.jpg"
            "dist/marketing/product-sunscreen.jpg"
            "dist/marketing/product-headphones.jpg"
          )

          echo "Marketing assets in dist:"
          find dist/marketing -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

          for asset in "${assets[@]}"; do
            test -s "$asset"
            mime="$(file --brief --mime-type "$asset")"
            echo "$asset -> $mime"
            if [[ "$mime" != "image/jpeg" ]]; then
              echo "::error file=$asset::Expected image/jpeg, got $mime"
              exit 1
            fi
          done

      # GitHub Pages 对 history 路由的直接访问会回退到 404.html。
      # 复制 SPA 入口后，Vue Router 可继续根据当前 URL 完成客户端路由匹配。
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: h5-editor-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Deploy Preview
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed marketing assets
        shell: bash
        env:
          PREVIEW_BASE_URL: https://icnpath.com/ai-h5-editor
        run: |
          set -euo pipefail

          # Give the CDN/static host a short window to expose the new deployment.
          sleep 5

          assets=(
            "marketing/summer-hero.jpg"
            "marketing/product-sunscreen.jpg"
            "marketing/product-headphones.jpg"
          )

          for asset in "${assets[@]}"; do
            url="${PREVIEW_BASE_URL}/${asset}"
            echo "Checking $url"

            headers="$(curl --silent --show-error --location --retry 4 --retry-delay 2 --dump-header - --output /tmp/asset-body "$url")"
            status="$(printf '%s\n' "$headers" | awk 'toupper($1) ~ /^HTTP\// { code=$2 } END { print code }')"
            content_type="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^content-type:/ { value=$0 } END { sub(/^[^:]+:[[:space:]]*/, "", value); sub(/\r$/, "", value); print tolower(value) }')"

            echo "HTTP $status | Content-Type: ${content_type:-<missing>}"

            if [[ "$status" != "200" ]]; then
              echo "::error::$url returned HTTP $status"
              exit 1
            fi

            if [[ "$content_type" != image/jpeg* ]]; then
              echo "::error::$url expected image/jpeg but got '${content_type:-missing}'. This usually means the static host returned the SPA index.html fallback instead of the image file."
              echo "Response body preview:"
              head -c 200 /tmp/asset-body || true
              echo
              exit 1
            fi
          done
